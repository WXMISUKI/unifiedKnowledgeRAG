services:
  unified-knowledge-rag:
    build:
      context: .
    image: unified-knowledge-rag:local
    env_file:
      - .env
    ports:
      - "8020:8020"
    volumes:
      - ./app/data/sources:/app/app/data/sources:ro
      - ./app/data/indexes:/app/app/data/indexes
      - ./models:/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
