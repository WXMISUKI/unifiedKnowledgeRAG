services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: unifiedKnowledgeRAG
      POSTGRES_USER: unified_knowledge_rag
      POSTGRES_PASSWORD: unified_knowledge_rag
    ports:
      - "5433:5432"
    volumes:
      - ./docker/pgvector/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/pgvector/data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U unified_knowledge_rag -d unifiedKnowledgeRAG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - pgvector
